      <!-- The planet: one circle, its top as a smooth stroked arc. Strokes keep their pixel widths; each fades along the arc by its gradient. -->
      <svg class="limb" viewBox="0 0 1000 1000" fill="none" focusable="false">
        <defs>
          <path id="limb-arc" d="M117 178.6A500 500 0 0 1 883 178.6" vector-effect="non-scaling-stroke"/>
          <path id="limb-body" d="M117 178.6A500 500 0 0 1 883 178.6V1000H117Z"/>
          <!-- Mirrored about the sun (x 500): offset 1 is 40% of the planet's width away. -->
          <linearGradient id="limb-rim" gradientUnits="userSpaceOnUse" x1="500" x2="900" spreadMethod="reflect">
            <stop stop-color="#fffdf6"/><stop offset=".14" stop-color="#fffae5"/><stop offset=".24" stop-color="#ffe4c9" stop-opacity=".86"/><stop offset=".32" stop-color="#dfc2b2" stop-opacity=".6"/>
            <stop offset=".48" stop-color="#b9a9a8" stop-opacity=".46"/><stop offset=".75" stop-color="#9aa0b0" stop-opacity=".26"/><stop offset="1" stop-color="#9aa0b0" stop-opacity=".17"/>
          </linearGradient>
          <linearGradient id="limb-hot" gradientUnits="userSpaceOnUse" x1="500" x2="900" spreadMethod="reflect">
            <stop stop-color="#fff"/><stop offset=".1" stop-color="#fff4e2" stop-opacity=".9"/><stop offset=".2" stop-color="#ffe2bc" stop-opacity=".66"/><stop offset=".3" stop-color="#ffcf9c" stop-opacity=".36"/><stop offset=".42" stop-color="#ffc890" stop-opacity=".12"/><stop offset=".55" stop-color="#ffc890" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <use href="#limb-body" fill="#000"/>
        <!-- The rim: warm to the screen's edges, overexposed near the sun. -->
        <g class="rim">
          <use href="#limb-arc" stroke="url(#limb-rim)" stroke-width="7" stroke-opacity=".1"/>
          <use href="#limb-arc" stroke="url(#limb-rim)" stroke-width="4" stroke-opacity=".3"/>
          <use href="#limb-arc" stroke="url(#limb-rim)" stroke-width="1.6"/>
        </g>
        <g class="hot">
          <use href="#limb-arc" stroke="url(#limb-hot)" stroke-width="12" stroke-opacity=".3"/>
          <use href="#limb-arc" stroke="url(#limb-hot)" stroke-width="5"/>
        </g>
      </svg>
      <!-- The turning earth: its surface turns along the rim, the band below a little faster, while its light stays under the sun.
           Each band is two copies, half a cycle apart, crossing over so the turn never ends. -->
      <span class="earth"><span class="pair"><span class="surface outer"></span><span class="surface outer later"></span></span><span class="pair"><span class="surface inner"></span><span class="surface inner later"></span></span></span>
      <span class="air"></span><span class="sun"></span></div>

    <!-- Saga, under the sun on the planet's dark side: the way to its page, in the serif of that page's title. -->
    <!-- Saga's star (the founder's reference, 12 Nov): thin rays from a bright point, the vertical longest; here in the word's own colour. -->
